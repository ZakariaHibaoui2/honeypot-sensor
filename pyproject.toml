[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "honeypot-sensor"
version = "1.0.0"
description = "Low-interaction honeypot sensor (asyncio): emulates SSH, Telnet, FTP and HTTP admin login to capture attacker banners, credentials, commands and paths as JSON events, with threat analytics and MITRE mapping."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Zakaria Hibaoui" }]
dependencies = [
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "httpx>=0.27"]

[project.scripts]
honeytrap = "honeytrap.cli:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"honeytrap" = ["data/*", "rules/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 125
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008", "B905"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
